name: Release

# Publishes a Developer ID signed, notarized DMG and the Sparkle appcast for a `vX.Y.Z` tag,
# then updates the cask in rcanoff/homebrew-tap.
#
# Secrets live in the `release` environment, which is limited to `v*` tags and requires
# reviewer approval; jobs outside it never receive them.
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)" certificate name
#   APPLE_CERTIFICATE           Base64 of that certificate exported as .p12
#   APPLE_CERTIFICATE_PASSWORD  Password of that .p12
#   APPLE_API_KEY               App Store Connect API key ID for notarytool
#   APPLE_API_ISSUER            Issuer ID of that API key
#   APPLE_API_KEY_CONTENT       Contents of that API key's .p8 file
#   SPARKLE_ED_PRIVATE_KEY      Sparkle EdDSA private key (`generate_keys --account abridge -x`)
#   HOMEBREW_TAP_TOKEN          Token with contents write access to rcanoff/homebrew-tap

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    # Apple notarization usually takes under a minute but can queue for most of an hour per submission.
    timeout-minutes: 180
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: CFBundleVersion is the commit count of the tagged commit.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: aarch64-apple-darwin

      - uses: extractions/setup-just@v2

      - name: Install signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

          base64 --decode <<<"$APPLE_CERTIFICATE" >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          existing_keychains=()
          while IFS= read -r line; do
            existing_keychains+=("$(xargs <<<"$line")")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          printf '%s\n' "$APPLE_API_KEY_CONTENT" >"$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials abridge-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" >"$RUNNER_TEMP/sparkle-ed-key"

      - name: Build, notarize, and generate appcast
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEYCHAIN_PROFILE: abridge-notary
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/sparkle-ed-key
        run: NOTARY_KEYCHAIN="$RELEASE_KEYCHAIN" just release-build "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/release/ABridge-$version.dmg" \
            build/release/appcast.xml \
            --title "ABridge $version" \
            --generate-notes \
            --verify-tag

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tap="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          git clone https://github.com/rcanoff/homebrew-tap.git "$tap"
          mkdir -p "$tap/Casks"
          scripts/homebrew-cask.sh "$version" "build/release/ABridge-$version.dmg" >"$tap/Casks/abridge.rb"
          git -C "$tap" add Casks/abridge.rb
          git -C "$tap" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "abridge $version"
          git -C "$tap" push origin HEAD:main

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle-ed-key"
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
