name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
  pull_request:
    paths:
      - "rust/**"

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - uses: extractions/setup-just@v2

      - name: Rust CI
        run: just ci-rust
        env:
          TZ: UTC