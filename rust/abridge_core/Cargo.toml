[package]
name = "abridge_core"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["lib", "staticlib"]
name = "abridge_core"

[features]
# Enables the start() pause seam for integration tests (library is built without `cfg(test)` for `tests/`).
test-sync = []

[dependencies]
uniffi = { version = "0.31", features = ["cli"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
http = "1"
jiff = "0.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
prost = { version = "0.14.4", features = ["derive"] }
base64 = "0.23.1"
nucleo-matcher = { version = "0.3.1", features = ["unicode-casefold", "unicode-normalization"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
anydoc = "0.2.4"
lopdf = { version = "=0.45.0", default-features = false }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "../uniffi-bindgen.rs"
