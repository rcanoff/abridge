name: ABridge
options:
  bundleIdPrefix: io.github.rcanoff
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  ABridge:
    type: application
    platform: macOS
    sources:
      - path: ABridge
        excludes:
          - AGENTS.md
    dependencies:
      - framework: ABridgeCore/abridge_core.xcframework
        embed: false
      - sdk: ServiceManagement.framework
      - package: Sparkle
    postBuildScripts:
      - name: Stamp Git Version
        script: '"$SRCROOT/scripts/stamp-build-version.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rcanoff.ABridge
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ABridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: ABridge/ABridge.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSRemindersUsageDescription: "ABridge needs access to your reminders to expose them through the local MCP bridge."
        INFOPLIST_KEY_NSContactsUsageDescription: "ABridge needs access to your contacts to expose them through the local MCP bridge."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "ABridge needs access to your calendars and events to expose them through the local MCP bridge."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "ABridge needs full access to your calendars and events to expose them through the local MCP bridge."
        INFOPLIST_KEY_NSLocationUsageDescription: "ABridge shares your Mac's current location with local MCP clients when you enable Core Location in Settings."
        INFOPLIST_KEY_CFBundleDisplayName: ABridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ABridge/ABridge-Bridging-Header.h
  ABridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ABridgeTests
        excludes:
          - AGENTS.md
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ABridge